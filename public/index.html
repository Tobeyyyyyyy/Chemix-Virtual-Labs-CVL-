<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborative Virtual Chemistry Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #canvas:active { cursor: grabbing; }
    .ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .ui-panel h1 { font-size: 1.1rem; margin-bottom: 10px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    button {
      background: #0284c7;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="ui-panel">
    <h1>🧪 Interactive Chemistry Engine</h1>
    <button onclick="resetExperiment()">Reset Neutralization Experiment</button>
  </div>

  <canvas id="canvas"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
