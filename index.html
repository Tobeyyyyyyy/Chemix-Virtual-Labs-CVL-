<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chemix Lab — Reimagined</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app">

        <!-- Top Bar -->
        <header class="topbar">
            <div class="logo">
                <div class="logo-icon">⚗</div>
                <span>Chemix</span><span style="color:var(--text-muted);font-weight:400;">Lab</span>
            </div>
            <div class="exp-title">
                <input id="expTitle" value="Untitled Experiment" placeholder="Experiment title" />
            </div>
            <div class="top-actions">
                <button id="newBtn">➕ New</button>
                <button id="saveBtn">💾 Save</button>
                <button id="resetBtn">↻ Reset</button>
                <button id="clearBtn">🗑 Clear</button>
                <button id="helpBtn" class="primary">❓ Help</button>
            </div>
        </header>

        <!-- Workspace -->
        <div class="workspace">

            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="search">
                    <input id="searchBox" placeholder="Search items..." />
                </div>
                <div class="category-tabs" id="categoryTabs">
                    <button class="active" data-cat="apparatus">Vessels</button>
                    <button data-cat="tools">Tools</button>
                    <button data-cat="solids">Solids</button>
                    <button data-cat="liquids">Liquids</button>
                    <button data-cat="indicators">Indicators</button>
                </div>
                <div class="palette-grid" id="paletteGrid"></div>
                <div class="sidebar-footer">⚡ Drag & drop onto the bench</div>
            </aside>

            <!-- Stage -->
            <section class="stage-wrap">
                <div class="stage-toolbar">
                    <div class="stage-tools">
                        <button id="zoomOutBtn">−</button>
                        <span class="zoom-val" id="zoomVal">100%</span>
                        <button id="zoomInBtn">＋</button>
                        <button id="centerBtn">◎ Center</button>
                    </div>
                    <div class="stage-status">
                        <span class="dot"></span>
                        <span id="statusText">Ready</span>
                    </div>
                </div>
                <div id="stage" class="stage" tabindex="0">
                    <div class="grid-bg"></div>
                    <div class="light"></div>
                    <div class="hint" id="hint">
                        <strong>🧪 Build your experiment</strong>
                        <span>Drag items from the left panel onto the bench</span>
                    </div>
                    <div id="objectLayer" class="object-layer"></div>
                </div>

                <!-- Bottom Panel -->
                <div class="bottom-panel">
                    <div class="step-chips">
                        <button class="active" data-step="1">1 Setup</button>
                        <button data-step="2">2 Reagents</button>
                        <button data-step="3">3 Observe</button>
                        <button data-step="4">4 Record</button>
                    </div>
                    <div class="observation-box">
                        <div class="label">Observation</div>
                        <div class="text" id="observationText">No reaction started.</div>
                    </div>
                    <button id="runBtn" class="run-btn">▶ Run Simulation</button>
                </div>
            </section>

            <!-- Inspector -->
            <aside class="inspector" id="inspector">
                <div class="inspector-header">
                    <div>
                        <h3 id="inspectorTitle">Nothing selected</h3>
                        <div class="sub" id="inspectorSub">Select an object to edit</div>
                    </div>
                    <button id="closeInspector" style="font-size:20px;color:var(--text-muted);">×</button>
                </div>
                <div class="inspector-body" id="inspectorBody">
                    <div class="empty-inspector">
                        <div class="icon">🔬</div>
                        <p>Select an object on the bench to see its properties.</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
        <div class="modal-card">
            <h2 id="modalTitle">Info</h2>
            <div id="modalContent"><p>Content</p></div>
            <button class="btn-close" id="modalClose">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
