<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemix Virtual Labs (CVL)</title>
  <link rel="stylesheet" href="app/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="back" title="Back">‹</span><span class="brand-mark">C</span><span>Chemix Virtual Labs (CVL)</span></div>
    <div class="toolbar">
      <div class="tool" id="save"><span class="ico">▣</span><span class="tool-label">Save</span></div>
      <div class="tool" id="clear"><span class="ico">▱</span><span class="tool-label">Clear</span></div>
      <div class="tool" id="settings" tabindex="0" title="Open lab settings"><span class="ico">⚙</span><span class="tool-label">Settings</span></div>
    </div>
    <div class="title"><span id="lab-title">Unnamed experiment</span><button id="rename" title="Rename experiment">✎</button></div>
    <div class="toolbar-end"><div class="tool"><span class="ico">▣</span><span class="tool-label">Teaching demo</span></div></div>
  </header>
  <main class="app">
    <section class="workbench" id="workspace">
      <div class="empty" id="empty"><div><strong>＋</strong>Drag equipment here to start</div></div>
      <div class="canvas-tools"><button id="center" title="Center">⌖</button><button class="zoom" id="zoom">100%</button><button id="lock" title="Lock canvas">♧</button><button id="paint" title="Background">♢</button><button id="minus">−</button><button id="plus">＋</button></div>
      <div class="notice">Safety Warning: Chemical experiments carry risks. Do not imitate in real life.</div>
    </section>
    <aside class="drawer">
      <nav class="categories">
        <div class="category active" data-category="reactor"><span class="cat-icon">⚗</span>Reaction<br>vessel</div>
        <div class="category" data-category="aid"><span class="cat-icon">♨</span>Assistive<br>devices</div>
        <div class="category" data-category="solid"><span class="cat-icon">▣</span>Solid<br>chemical</div>
        <div class="category" data-category="liquid"><span class="cat-icon">◈</span>Liquid<br>chemicals</div>
        <div class="category" data-category="gas"><span class="cat-icon">◌</span>Gas<br>chemicals</div>
      </nav>
      <div class="drawer-main">
        <div class="drawer-head"><span>⌕</span><input id="search" placeholder="Search equipment"><span class="view-toggle">▦</span></div>
        <div class="section">Reaction vessel <span id="count"></span></div>
        <div class="item-grid" id="equipment-grid"></div>
      </div>
    </aside>
  </main>
  <script src="app/catalog.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
